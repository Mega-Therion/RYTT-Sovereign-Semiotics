name: Formal Proofs Verification (Lean 4)

on:
  push:
    branches: [main]
    paths:
      - 'proofs/**'
      - 'spec/**'
      - 'crates/rytt-core/**'
  pull_request:
    branches: [main]
    paths:
      - 'proofs/**'
      - 'spec/**'

jobs:
  # ── Standalone proofs: core Lean only, no Mathlib, seconds to build ──
  lean-standalone:
    name: Standalone proofs (no Mathlib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (pinned toolchain from proofs/lean-toolchain)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat proofs/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify standalone proofs compile, with no sorry
        run: |
          cd proofs
          lean --version

          # Check RYTT_standalone.lean (existing, verified)
          lean RYTT_standalone.lean
          # Ask the COMPILER whether a declaration uses sorry
          lean RYTT_standalone.lean 2>&1 | grep -q sorry && exit 1 || true

          # Check RYTT_sovereign.lean (Phase 2: expanded structures)
          lean RYTT_sovereign.lean
          lean RYTT_sovereign.lean 2>&1 | grep -q sorry && exit 1 || true

          echo "All standalone proofs compile with zero sorry."

  # ── Full lake build (requires Mathlib, ~8GB cache) ──────────────────
  # This job is intentionally optional — the standalone proofs above
  # are the blocking gate. The full lake build is run on a schedule
  # to catch regressions in the Mathlib-dependent proofs.
  lean-full:
    name: Full lake build (Mathlib)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat proofs/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Mathlib
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            proofs/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('proofs/lean-toolchain', 'proofs/lakefile.lean') }}

      - name: Machine-check proofs
        run: |
          cd proofs
          lake --version
          lake build
