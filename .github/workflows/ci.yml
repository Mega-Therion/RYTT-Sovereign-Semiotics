name: RYTT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Gates the one Lean file in this repository whose content is actually
  # verified. proofs/RYTT_standalone.lean has no imports -- core Lean only, no
  # Mathlib -- so this job needs no cache, no lake build, and finishes in
  # seconds. It was previously absent from the lakefile, from CI, and from every
  # document including the retraction record, so nothing anywhere would have
  # noticed it breaking.
  #
  # This deliberately does NOT build proofs/RYTT.lean or proofs/RYTTProofs/*.
  # Those import Mathlib and do not compile; see CLAUDE.md. Adding them here
  # would only make CI permanently red without proving anything new.
  lean-standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (pinned toolchain from proofs/lean-toolchain)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain "$(cat proofs/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify the standalone proofs compile, with no sorry
        run: |
          cd proofs
          lean --version

          # Ask the COMPILER whether a declaration uses sorry, rather than
          # grepping the source for the word. A grep is a proxy for the property
          # and gets it wrong in both directions: it fires on the word appearing
          # in a comment (it did -- on this file's own documentation), and it
          # would miss a sorry introduced through a macro or an imported
          # declaration. Lean emits "declaration uses 'sorry'" as a warning, and
          # that is the authoritative signal.
          lean RYTT_standalone.lean 2>&1 | tee /tmp/lean-out.txt
          test "${PIPESTATUS[0]}" -eq 0 || { echo "::error::RYTT_standalone.lean failed to compile" >&2; exit 1; }

          # Lean writes this with BACKTICKS: declaration uses `sorry`
          # A pattern using straight quotes matches nothing and the guard passes
          # silently -- which is how the first version of this check was written,
          # and it was caught only by injecting a real sorry and watching the
          # guard stay quiet. The character class accepts either quoting style.
          if grep -qE "declaration uses [\`']sorry[\`']" /tmp/lean-out.txt; then
            echo "::error::the compiler reports a declaration using sorry" >&2
            grep -nE "declaration uses [\`']sorry[\`']" /tmp/lean-out.txt >&2
            exit 1
          fi
          echo "RYTT_standalone.lean: compiled clean, compiler reports no sorry"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable) + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate web data and fixtures
        run: python scripts/generate_web_data.py

      - name: Verify canonical specification and conformance vectors
        run: |
          python scripts/generate_canonical_spec.py --check
          python scripts/generate_conformance_vectors.py --check
          python scripts/verify_conformance.py
          python scripts/check_formal_alignment.py

      - name: Verify generated data matches compiler
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "src")
          from rytt.compiler import RYTT_GENOME, RYTT_LIGATURES
          vocab = json.loads(Path("fixtures/rytt_vocabulary.json").read_text())
          assert vocab["stats"]["genome_entries"] == len(RYTT_GENOME), "genome count mismatch"
          assert vocab["stats"]["ligature_entries"] == len(RYTT_LIGATURES), "ligature count mismatch"
          assert Path("web/rytt-data.js").exists(), "web/rytt-data.js not generated"
          print("Generated data verified OK")
          PY

      - name: Run invariant tests
        run: python -m pytest tests/ -v

      - name: Run glyph atlas data tests
        run: python -m pytest benchmarks/test_glyph_atlas_data.py -v

      - name: Run native lossless and integration tests
        run: python -m pytest benchmarks/test_rytt_native_lossless.py benchmarks/test_4leibniz_bridge.py -v

      - name: Run benchmark suite and save artifact
        run: |
          python benchmarks/run_benchmarks.py
          python benchmarks/arena.py

      - name: Verify artifact export and replay
        run: |
          printf 'CI verified artifact — naïve 東京' | rytt artifact-export /tmp/rytt-ci-artifact.zip
          rytt artifact-verify /tmp/rytt-ci-artifact.zip | grep -q '"valid": true'

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-py${{ matrix.python-version }}
          path: benchmarks/results/
          if-no-files-found: warn

      - name: CLI smoke test
        run: |
          echo "Hello RYTT" | rytt encode | rytt decode | grep -q "Hello RYTT"
          echo "CLI round-trip smoke test passed"

      - name: Accessibility and performance smoke checks
        run: |
          python scripts/audit_static_site.py
          python scripts/perf_smoke.py

      - name: Validate static deployment surface
        run: |
          test -f index.html
          test -f styles.css
          test -f vercel.json
          test -f robots.txt
          test -f sitemap.xml
          test -f web/codex.html
          test -f benchmarks/results/arena.html
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path("vercel.json").read_text())
          assert "<title>" in Path("index.html").read_text()
          PY
