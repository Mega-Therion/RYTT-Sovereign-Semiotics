name: RYTT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy

      - name: Run glyph atlas data tests
        run: |
          python -m pytest benchmarks/test_glyph_atlas_data.py -v

      - name: Run native lossless and integration tests
        run: |
          python -m pytest benchmarks/test_rytt_native_lossless.py benchmarks/test_4leibniz_bridge.py -v

      - name: Validate static deployment surface
        run: |
          test -f index.html
          test -f styles.css
          test -f vercel.json
          test -f robots.txt
          test -f sitemap.xml
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('vercel.json').read_text())
          assert '<title>' in Path('index.html').read_text()
          PY

      - name: Run benchmark suite
        run: |
          python benchmarks/run_benchmarks.py
