name: Ancient-script contract CI

on:
  push:
    branches: [main]
    paths:
      - "research/ancient_scripts/**"
      - "scripts/validate_ancient_script_records.py"
      - "tests/test_ancient_script_records.py"
      - "tests/test_cdli_metadata_adapter.py"
      - ".github/workflows/ancient-script-ci.yml"
  pull_request:
    paths:
      - "research/ancient_scripts/**"
      - "scripts/validate_ancient_script_records.py"
      - "tests/test_ancient_script_records.py"
      - "tests/test_cdli_metadata_adapter.py"
      - ".github/workflows/ancient-script-ci.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate research sample invariants
        run: python scripts/validate_ancient_script_records.py
      - name: Run research contract and adapter tests
        run: python -m unittest tests/test_ancient_script_records.py tests/test_cdli_metadata_adapter.py -v
      - name: Validate JSON Schema against sample
        run: |
          python -m pip install --disable-pip-version-check "jsonschema==4.25.1"
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path(".")
          schema = json.loads((root / "research/ancient_scripts/schema/claim-record-v0.1.0.schema.json").read_text())
          document = json.loads((root / "research/ancient_scripts/samples/cdli-proto-elamite-sample.json").read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          for i, record in enumerate(document["records"]):
              errors = sorted(validator.iter_errors(record), key=lambda e: list(e.path))
              if errors:
                  for error in errors:
                      print(f"records[{i}] {'/'.join(map(str, error.path))}: {error.message}")
                  raise SystemExit(1)
          print(f"PASS: JSON Schema v0.1.0 validates {len(document['records'])} sample records")
          PY
