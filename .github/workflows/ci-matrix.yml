name: Continuous Integration Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust core: multi-OS, stable + beta ──────────────────────────────
  core-matrix:
    name: Core Engine (${{ matrix.os }} / Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    defaults:
      run:
        working-directory: crates/rytt-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rytt-core
      - name: Format check
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test suite
        run: cargo test --workspace --verbose

  # ── Python interop: multi-OS, Python 3.10–3.12 ───────────────────────
  python-matrix:
    name: Python Interop (${{ matrix.os }} / Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" hypothesis
      - name: Run invariant tests
        run: python -m pytest tests/ -v
      - name: Run property-based fuzzing
        run: python -m pytest tests/test_fuzz_hypothesis.py -v

  # ── Conformance replay ──────────────────────────────────────────────
  conformance-audit:
    name: Cross-Repository Conformance Replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rytt-core
      - name: Verify conformance vectors
        run: |
          cd crates/rytt-core
          cargo test --test conformance -- --nocapture
      - name: Validate vector schema
        run: |
          pip install jsonschema
          python - <<'PY'
          import json
          from jsonschema import validate
          schema = json.load(open("conformance/vector.schema.json"))
          vectors = json.load(open("conformance/vectors.json"))
          for v in vectors["vectors"]:
              # Adapt to schema format for validation
              entry = {
                  "id": v["id"],
                  "category": v.get("category", "baseline"),
                  "raw_input": v["source"],
                  "normalization_preservation": v.get("normalization_preservation", "exact_binary"),
                  "expected_planes": [t.get("family", "passthrough") for t in v.get("tokens", [])],
                  "expected_tokens": [ord(t["pua"]) if len(t["pua"]) == 1 else 0 for t in v.get("tokens", [])],
                  "roundtrip_assert": v.get("decoded", "") == v.get("source", ""),
              }
              validate(instance=entry, schema=schema)
          print(f"Schema validation passed for {len(vectors['vectors'])} vectors")
          PY

  # ── Fuzzing (nightly, separate from blocking CI) ─────────────────────
  fuzz-nightly:
    name: cargo-fuzz (nightly)
    runs-on: ubuntu-latest
    if: github.event.schedule != ''
    defaults:
      run:
        working-directory: crates/rytt-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rytt-core
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Run roundtrip fuzz target (60s)
        run: cargo +nightly fuzz run roundtrip -- -max_total_time=60
      - name: Run envelope integrity fuzz target (60s)
        run: cargo +nightly fuzz run envelope_integrity -- -max_total_time=60
