<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120" font-family="Inter, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c8a04e" opacity="0.5"/>
    </marker>
  </defs>

  <!-- 5 pipeline stages -->
  <g transform="translate(20, 20)">
    <!-- Stage 1: Plain Text -->
    <rect width="140" height="60" rx="8" fill="rgba(245,236,215,0.04)" stroke="#f5ecd7" stroke-width="0.5" opacity="0.8"/>
    <text x="70" y="25" text-anchor="middle" fill="#f5ecd7" font-size="12" font-weight="600">Plain Text</text>
    <text x="70" y="42" text-anchor="middle" fill="#c4b896" font-size="9" opacity="0.6">"Tyger Tyger…"</text>
    <text x="70" y="54" text-anchor="middle" fill="#5a6580" font-size="7" opacity="0.5">ASCII / UTF-8</text>

    <!-- Arrow -->
    <line x1="140" y1="30" x2="165" y2="30" stroke="#c8a04e" stroke-width="1" opacity="0.4" marker-end="url(#arrow)"/>

    <!-- Stage 2: Chord Matching -->
    <rect x="170" width="140" height="60" rx="8" fill="rgba(200,160,78,0.04)" stroke="#c8a04e" stroke-width="0.5" opacity="0.6"/>
    <text x="240" y="25" text-anchor="middle" fill="#c8a04e" font-size="12" font-weight="600">Chord Matching</text>
    <text x="240" y="42" text-anchor="middle" fill="#d4a843" font-size="9" opacity="0.6">Greedy longest-match</text>
    <text x="240" y="54" text-anchor="middle" fill="#5a6580" font-size="7" opacity="0.5">22 chord ligatures</text>

    <line x1="310" y1="30" x2="335" y2="30" stroke="#c8a04e" stroke-width="1" opacity="0.4" marker-end="url(#arrow)"/>

    <!-- Stage 3: Native Token IDs -->
    <rect x="340" width="140" height="60" rx="8" fill="rgba(0,229,255,0.04)" stroke="#00e5ff" stroke-width="0.5" opacity="0.5"/>
    <text x="410" y="25" text-anchor="middle" fill="#00e5ff" font-size="12" font-weight="600">Native Token IDs</text>
    <text x="410" y="42" text-anchor="middle" fill="#2b8aa0" font-size="9" opacity="0.6">Atomic integers 0–199</text>
    <text x="410" y="54" text-anchor="middle" fill="#5a6580" font-size="7" opacity="0.5">No BPE byte-fallback</text>

    <line x1="480" y1="30" x2="505" y2="30" stroke="#c8a04e" stroke-width="1" opacity="0.4" marker-end="url(#arrow)"/>

    <!-- Stage 4: Dual-Plane Placement -->
    <rect x="510" width="140" height="60" rx="8" fill="rgba(123,95,255,0.04)" stroke="#7b5fff" stroke-width="0.5" opacity="0.5"/>
    <text x="580" y="25" text-anchor="middle" fill="#7b5fff" font-size="12" font-weight="600">Dual-Plane</text>
    <text x="580" y="42" text-anchor="middle" fill="#a99aff" font-size="9" opacity="0.6">Ground Z=0 / Elevated Z=25</text>
    <text x="580" y="54" text-anchor="middle" fill="#5a6580" font-size="7" opacity="0.5">PUA codepoints assigned</text>

    <line x1="650" y1="30" x2="675" y2="30" stroke="#c8a04e" stroke-width="1" opacity="0.4" marker-end="url(#arrow)"/>

    <!-- Stage 5: Lossless Decompilation -->
    <rect x="680" width="180" height="60" rx="8" fill="rgba(0,229,255,0.04)" stroke="#00e5ff" stroke-width="0.5" opacity="0.5"/>
    <text x="770" y="25" text-anchor="middle" fill="#00e5ff" font-size="12" font-weight="600">Lossless Decompilation</text>
    <text x="770" y="42" text-anchor="middle" fill="#2b8aa0" font-size="9" opacity="0.6">D(C(S)) ≡ S · 100% roundtrip</text>
    <text x="770" y="54" text-anchor="middle" fill="#5a6580" font-size="7" opacity="0.5">Lean 4 verified</text>
  </g>

  <!-- Reverse arrow -->
  <path d="M 770 82 Q 410 100 70 82" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="410" y="96" text-anchor="middle" fill="#00e5ff" font-size="8" opacity="0.4">reversible — zero information loss</text>
</svg>
