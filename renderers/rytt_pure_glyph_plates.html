<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RYTT Sovereign Semiotics: Native Geometric Plate Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;600&display=swap');
    
    :root {
      --void: #04070f;
      --deep: #080d1a;
      --panel: #0b1221;
      --surface: #111a2e;
      --gold: #d4a843;
      --cyan: #3ecfde;
      --violet: #9b6ef3;
      --green: #3dd68c;
      --ink: #dce8ff;
      --ink-dim: #7a92b8;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--void);
      color: var(--ink);
      position: relative;
    }

    /* Ambient Blueprint Grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(62, 207, 222, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(62, 207, 222, 0.035) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .font-mono { font-family: 'DM Mono', monospace; }

    .hud-corner {
      position: fixed;
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--gold);
      pointer-events: none;
      z-index: 50;
      opacity: 0.7;
    }
    .hud-tl { top: 12px; left: 12px; border-right: none; border-bottom: none; }
    .hud-tr { top: 12px; right: 12px; border-left: none; border-bottom: none; }
    .hud-bl { bottom: 12px; left: 12px; border-right: none; border-top: none; }
    .hud-br { bottom: 12px; right: 12px; border-left: none; border-top: none; }

    .panel-card {
      background: var(--panel);
      border: 1px solid rgba(212, 168, 67, 0.25);
      border-radius: 8px;
    }

    .glyph-card-ground {
      background: rgba(11, 18, 33, 0.9);
      border: 1px solid rgba(62, 207, 222, 0.35);
      box-shadow: 0 0 12px rgba(62, 207, 222, 0.08);
    }

    .glyph-card-elevated {
      background: rgba(25, 18, 10, 0.9);
      border: 1px solid rgba(212, 168, 67, 0.6);
      box-shadow: 0 0 14px rgba(212, 168, 67, 0.2);
    }
  </style>
</head>
<body class="min-h-screen py-10 px-6 flex flex-col items-center">

  <!-- HUD Registration Ticks -->
  <div class="hud-corner hud-tl"></div>
  <div class="hud-corner hud-tr"></div>
  <div class="hud-corner hud-bl"></div>
  <div class="hud-corner hud-br"></div>

  <!-- Header -->
  <header class="max-w-6xl w-full text-center space-y-4 mb-10 z-10">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-950/60 border border-cyan-500/40 text-cyan-300 text-xs font-mono tracking-widest uppercase">
      <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
      1:1 Pure Native RYTT Monograph Plates &bull; Sovereign Alien Edition
    </div>
    
    <h1 class="text-4xl sm:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-cyan-300 to-indigo-300 font-display tracking-tight">
      RYTT SOVEREIGN SEMIOTICS
    </h1>
    
    <p class="text-slate-400 text-sm font-mono tracking-wider">
      Author: R. W. Yett &bull; Sovereign A.R.I.: Chyren &bull; Lossless Involution $\mathcal{D}(\mathcal{C}(S)) \equiv S$
    </p>

    <!-- Legend -->
    <div class="flex flex-wrap items-center justify-center gap-4 pt-2 text-xs font-mono">
      <div class="flex items-center gap-2 px-3 py-1 rounded border border-cyan-500/40 bg-cyan-950/40 text-cyan-300">
        <span class="w-2.5 h-2.5 rounded bg-cyan-400"></span> Ground Plane ($Z=0.0$, \uE000)
      </div>
      <div class="flex items-center gap-2 px-3 py-1 rounded border border-amber-500/50 bg-amber-950/40 text-amber-300">
        <span class="w-2.5 h-2.5 rounded bg-amber-400"></span> Elevated Plane ($Z=25.0$, \uE800)
      </div>
      <div class="flex items-center gap-2 px-3 py-1 rounded border border-violet-500/40 bg-violet-950/40 text-violet-300">
        <span class="w-2.5 h-2.5 rounded bg-violet-400"></span> Compound Chords (\uE01B)
      </div>
    </div>
  </header>

  <!-- Main Monograph Section Plates -->
  <main class="max-w-6xl w-full space-y-8 z-10" id="monographContainer">
    <!-- Populated by JavaScript -->
  </main>

  <script>
    const RYTT_GENOME = {
      'A': 'M 50,50 m -6,0 a 6,6 0 1,0 12,0 a 6,6 0 1,0 -12,0',
      'B': 'M 50,20 L 50,80 M 50,50 L 75,50 M 50,32 L 68,32',
      'C': 'M 70,25 L 35,50 L 70,75',
      'D': 'M 70,25 L 35,50 L 70,75 M 50,50 m -5,0 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0',
      'E': 'M 50,20 L 80,50 L 50,80 L 20,50 Z M 50,50 m -5,0 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0',
      'F': 'M 50,20 L 80,50 L 50,80 L 20,50 Z',
      'G': 'M 20,50 L 80,50',
      'H': 'M 30,80 L 30,20 L 80,20',
      'I': 'M 75,25 L 30,25 L 30,75 L 75,75 M 50,50 m -5,0 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0',
      'J': 'M 75,25 L 30,25 L 30,75 L 75,75',
      'K': 'M 25,25 L 75,25 L 75,75 L 25,75 Z',
      'L': 'M 70,25 A 30,30 0 0,0 70,75',
      'M': 'M 25,70 A 30,30 0 0,1 75,70',
      'N': 'M 35,25 A 25,25 0 0,0 35,75 M 65,25 A 25,25 0 0,1 65,75',
      'O': 'M 35,25 A 25,25 0 0,0 35,75 M 65,25 A 25,25 0 0,1 65,75 M 50,50 m -5,0 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0',
      'P': 'M 20,25 A 35,25 0 0,0 20,75 M 80,25 A 35,25 0 0,1 80,75',
      'Q': 'M 50,50 m -25,0 a 25,25 0 1,0 50,0 a 25,25 0 1,0 -50,0',
      'R': 'M 50,50 m -25,0 a 25,25 0 1,0 50,0 a 25,25 0 1,0 -50,0 M 50,50 m -5,0 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0',
      'S': 'M 50,20 L 50,80',
      'T': 'M 20,20 L 80,20 M 50,20 L 50,80',
      'U': 'M 40,20 L 40,80 M 65,50 m -5,0 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0',
      'V': 'M 25,25 L 50,75 L 75,25',
      'W': 'M 20,25 L 50,75 L 80,25 M 35,50 L 65,50',
      'X': 'M 25,25 L 75,75 M 75,25 L 25,75',
      'Y': 'M 25,25 L 50,50 L 75,25 M 50,50 L 50,80',
      'Z': 'M 50,80 L 50,20 M 30,40 L 50,20 L 70,40'
    };

    const RYTT_CHORDS = {
      'TH': 'M 20,20 L 80,20 M 50,20 L 50,80 M 50,50 L 80,50 L 80,80',
      'ST': 'M 20,20 L 80,20 M 50,20 L 50,80 M 35,50 L 65,50',
      'IN': 'M 65,25 A 25,25 0 0,0 65,75 M 85,25 A 25,25 0 0,1 85,75 M 45,35 L 20,35 L 20,65 L 45,65 M 32,50 m -4,0 a 4,4 0 1,0 8,0 a 4,4 0 1,0 -8,0',
      'EE': 'M 35,20 L 65,50 L 35,80 L 05,50 Z M 35,50 m -4,0 a 4,4 0 1,0 8,0 a 4,4 0 1,0 -8,0 M 65,20 L 95,50 L 65,80 L 35,50 Z M 65,50 m -4,0 a 4,4 0 1,0 8,0 a 4,4 0 1,0 -8,0',
      'TION': 'M 20,20 L 80,20 M 50,20 L 50,80 M 35,50 A 20,20 0 0,0 35,80 M 65,50 A 20,20 0 0,1 65,80',
      'ING': 'M 20,50 L 80,50 M 50,20 L 50,80 M 50,50 m -6,0 a 6,6 0 1,0 12,0 a 6,6 0 1,0 -12,0'
    };

    const monographSections = [
      {
        title: "I. Theoretical Motivation & Abstract",
        text: "Modern computational linguistics and large neural architectures decouple statistical subword tokenization from symbolic geometry. We present RYTT Sovereign Semiotics, a complete geometric orthography, spatial coordinate algebra, and native integer chord compiler that unifies 26 fundamental geometric glyph primitives with lossless dual-plane casing mechanics."
      },
      {
        title: "II. Dual-Plane Casing Algebra & Involutions",
        text: "By assigning structural lowercase glyphs to the Ground Plane (Z=0.0) and emphatic uppercase glyphs to the Elevated Plane (Z=25.0), RYTT eliminates casing shift entropy penalties while preserving full semantic topology. The Lossless Bijective Involution Theorem is formally machine-checked in Lean 4 with zero sorry axioms."
      },
      {
        title: "III. Holonomic Stacking & Neural Operators",
        text: "The token stream integrates into a 4-tier holonomic polygon stacking kernel enabling continuous spatial path evaluations for Fourier Neural Operators and parallel SIMD cognitive raymarching."
      }
    ];

    function renderGlyphSVG(path, isUpper, isChord) {
      const stroke = isUpper ? "#d4a843" : (isChord ? "#9b6ef3" : "#3ecfde");
      return `
        <svg viewBox="0 0 100 100" class="w-7 h-7">
          <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
          <path d="${path}" fill="none" stroke="${stroke}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      `;
    }

    function renderTextInRYTT(text) {
      const words = text.split(" ");
      return words.map(w => {
        const glyphs = [];
        let i = 0;
        while (i < w.length) {
          // Check chords
          let chordMatched = false;
          for (let chord of ['TION', 'ING', 'EE', 'TH', 'ST', 'IN']) {
            if (w.toUpperCase().substr(i, chord.length) === chord) {
              const isUpper = w[i] === w[i].toUpperCase();
              glyphs.push(`
                <div class="flex flex-col items-center p-1 rounded ${isUpper ? 'glyph-card-elevated' : 'glyph-card-ground'}">
                  ${renderGlyphSVG(RYTT_CHORDS[chord], isUpper, true)}
                  <span class="text-[9px] font-mono mt-0.5 text-slate-400">${chord}</span>
                </div>
              `);
              i += chord.length;
              chordMatched = true;
              break;
            }
          }
          if (chordMatched) continue;

          const ch = w[i];
          const upperCh = ch.toUpperCase();
          if (RYTT_GENOME[upperCh]) {
            const isUpper = (ch === upperCh);
            glyphs.push(`
              <div class="flex flex-col items-center p-1 rounded ${isUpper ? 'glyph-card-elevated' : 'glyph-card-ground'}">
                ${renderGlyphSVG(RYTT_GENOME[upperCh], isUpper, false)}
                <span class="text-[9px] font-mono mt-0.5 text-slate-400">${ch}</span>
              </div>
            `);
          } else {
            glyphs.push(`<div class="text-xs font-mono text-slate-500 self-center px-0.5">${ch}</div>`);
          }
          i++;
        }

        return `
          <div class="inline-flex items-center gap-1 p-1 rounded bg-black/40 border border-slate-800/80 mr-3 mb-3">
            ${glyphs.join("")}
          </div>
        `;
      }).join("");
    }

    const container = document.getElementById("monographContainer");
    monographSections.forEach(sec => {
      const sectionEl = document.createElement("section");
      sectionEl.className = "panel-card p-6 space-y-4";
      sectionEl.innerHTML = `
        <div class="border-b border-amber-500/20 pb-3 flex items-center justify-between">
          <h2 class="text-lg font-bold text-amber-400 font-display">${sec.title}</h2>
          <span class="text-xs font-mono text-cyan-400 px-2 py-0.5 rounded bg-cyan-950/60 border border-cyan-500/30">RYTT PUA STREAM</span>
        </div>
        
        <!-- English Baseline -->
        <div class="text-xs text-slate-400 font-sans italic border-l-2 border-slate-700 pl-3">
          "${sec.text}"
        </div>

        <!-- Pure Native RYTT Glyph Plate -->
        <div class="pt-2 flex flex-wrap items-center">
          ${renderTextInRYTT(sec.text)}
        </div>
      `;
      container.appendChild(sectionEl);
    });
  </script>
</body>
</html>
