<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>William Blake - The Tyger in Dual-Plane Lossless RYTT Script</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=JetBrains+Mono:wght@400;600&family=Inter:wght@300;400;600&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #060911;
      color: #e2e8f0;
    }
    
    .font-serif-title {
      font-family: 'Cinzel', serif;
    }
    
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .rytt-card {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(10, 15, 30, 0.9) 100%);
    }

    .rytt-card:hover {
      transform: translateY(-2px);
      border-color: rgba(0, 240, 255, 0.6);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
    }

    .glyph-svg-lower {
      filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.5));
    }

    .glyph-svg-upper {
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.7));
    }
    
    .gold-glow {
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
      border-color: rgba(255, 215, 0, 0.5);
    }
  </style>
</head>
<body class="min-h-screen py-10 px-4 flex flex-col items-center">

  <!-- Header -->
  <header class="max-w-5xl w-full text-center space-y-4 mb-8">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-950/70 border border-cyan-500/40 text-cyan-400 text-xs font-mono tracking-widest uppercase">
      <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
      Dual-Plane Lossless Semiotic Render &bull; Ground (Z=0) & Elevated (Z=25)
    </div>
    <h1 class="text-3xl sm:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-cyan-300 to-blue-400 font-serif-title tracking-wide">
      THE TYGER
    </h1>
    <p class="text-slate-400 text-sm font-mono tracking-wider">
      By William Blake (1794) &bull; Native Vocabulary &bull; Lossless Casing Inversion
    </p>

    <!-- Casing Mode Controls -->
    <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
      <button onclick="setPoemCase('mixed')" id="btnMixed" class="px-4 py-1.5 rounded-lg border border-cyan-500 bg-cyan-500/20 text-cyan-300 font-mono text-xs font-bold transition">
        Original Mixed Case
      </button>
      <button onclick="setPoemCase('lower')" id="btnLower" class="px-4 py-1.5 rounded-lg border border-slate-700 bg-slate-900/60 text-slate-400 font-mono text-xs font-bold hover:border-cyan-500/50 transition">
        All Lowercase (Z=0.0)
      </button>
      <button onclick="setPoemCase('upper')" id="btnUpper" class="px-4 py-1.5 rounded-lg border border-slate-700 bg-slate-900/60 text-slate-400 font-mono text-xs font-bold hover:border-amber-500/50 transition">
        All Uppercase (Z=25.0)
      </button>
    </div>
  </header>

  <!-- Poem Container -->
  <main class="max-w-5xl w-full space-y-6" id="poemContainer">
    <!-- Populated by JavaScript -->
  </main>

  <!-- Canonical RYTT Dual-Plane Engine Script -->
  <script>
    const RYTT_GENOME = {
      'A': { name: 'A', family: 'POINT', path: 'M 50,50 m -6,0 a 6,6 0 1,0 12,0 a 6,6 0 1,0 -12,0' },
      'B': { name: 'B', family: 'VECTOR', path: 'M 50,20 L 50,80 M 50,50 L 75,50 M 50,32 L 68,32' },
      'C': { name: 'C', family: 'CHEVRON', path: 'M 70,25 L 35,50 L 70,75' },
      'D': { name: 'D', family: 'CHEVRON', path: 'M 70,25 L 35,50 L 70,75 M 50,50 m -5,0 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0' },
      'E': { name: 'E', family: 'DIAMOND', path: 'M 50,20 L 80,50 L 50,80 L 20,50 Z M 50,50 m -5,0 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0' },
      'F': { name: 'F', family: 'DIAMOND', path: 'M 50,20 L 80,50 L 50,80 L 20,50 Z' },
      'G': { name: 'G', family: 'VECTOR', path: 'M 20,50 L 80,50' },
      'H': { name: 'H', family: 'FRAME', path: 'M 30,80 L 30,20 L 80,20' },
      'I': { name: 'I', family: 'FRAME', path: 'M 75,25 L 30,25 L 30,75 L 75,75 M 50,50 m -5,0 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0' },
      'J': { name: 'J', family: 'FRAME', path: 'M 75,25 L 30,25 L 30,75 L 75,75' },
      'K': { name: 'K', family: 'FRAME', path: 'M 25,25 L 75,25 L 75,75 L 25,75 Z' },
      'L': { name: 'L', family: 'ARC', path: 'M 70,25 A 30,30 0 0,0 70,75' },
      'M': { name: 'M', family: 'ARC', path: 'M 25,70 A 30,30 0 0,1 75,70' },
      'N': { name: 'N', family: 'ARC', path: 'M 35,25 A 25,25 0 0,0 35,75 M 65,25 A 25,25 0 0,1 65,75' },
      'O': { name: 'O', family: 'ARC', path: 'M 35,25 A 25,25 0 0,0 35,75 M 65,25 A 25,25 0 0,1 65,75 M 50,50 m -5,0 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0' },
      'P': { name: 'P', family: 'ARC', path: 'M 20,25 A 35,25 0 0,0 20,75 M 80,25 A 35,25 0 0,1 80,75' },
      'Q': { name: 'Q', family: 'RING', path: 'M 50,50 m -25,0 a 25,25 0 1,0 50,0 a 25,25 0 1,0 -50,0' },
      'R': { name: 'R', family: 'RING', path: 'M 50,50 m -25,0 a 25,25 0 1,0 50,0 a 25,25 0 1,0 -50,0 M 50,50 m -5,0 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0' },
      'S': { name: 'S', family: 'VECTOR', path: 'M 50,20 L 50,80' },
      'T': { name: 'T', family: 'VECTOR', path: 'M 20,20 L 80,20 M 50,20 L 50,80' },
      'U': { name: 'U', family: 'VECTOR', path: 'M 40,20 L 40,80 M 65,50 m -5,0 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0' },
      'V': { name: 'V', family: 'CHEVRON', path: 'M 25,25 L 50,75 L 75,25' },
      'W': { name: 'W', family: 'CHEVRON', path: 'M 20,25 L 50,75 L 80,25 M 35,50 L 65,50' },
      'X': { name: 'X', family: 'VECTOR', path: 'M 25,25 L 75,75 M 75,25 L 25,75' },
      'Y': { name: 'Y', family: 'BRANCH', path: 'M 25,25 L 50,50 L 75,25 M 50,50 L 50,80' },
      'Z': { name: 'Z', family: 'BRANCH', path: 'M 50,80 L 50,20 M 30,40 L 50,20 L 70,40' }
    };

    const RYTT_CHORDS = {
      'TH': { name: 'TH', path: 'M 20,20 L 80,20 M 50,20 L 50,80 M 50,50 L 80,50 L 80,80' },
      'ST': { name: 'ST', path: 'M 20,20 L 80,20 M 50,20 L 50,80 M 35,50 L 65,50' },
      'IN': { name: 'IN', path: 'M 65,25 A 25,25 0 0,0 65,75 M 85,25 A 25,25 0 0,1 85,75 M 45,35 L 20,35 L 20,65 L 45,65 M 32,50 m -4,0 a 4,4 0 1,0 8,0 a 4,4 0 1,0 -8,0' },
      'EE': { name: 'EE', path: 'M 35,20 L 65,50 L 35,80 L 05,50 Z M 35,50 m -4,0 a 4,4 0 1,0 8,0 a 4,4 0 1,0 -8,0 M 65,20 L 95,50 L 65,80 L 35,50 Z M 65,50 m -4,0 a 4,4 0 1,0 8,0 a 4,4 0 1,0 -8,0' },
      'TION': { name: 'TION', path: 'M 20,20 L 80,20 M 50,20 L 50,80 M 35,50 A 20,20 0 0,0 35,80 M 65,50 A 20,20 0 0,1 65,80' },
      'ING': { name: 'ING', path: 'M 20,50 L 80,50 M 50,20 L 50,80 M 50,50 m -6,0 a 6,6 0 1,0 12,0 a 6,6 0 1,0 -12,0' }
    };

    const originalPoem = [
      "Tyger Tyger, burning bright,",
      "In the forests of the night;",
      "What immortal hand or eye,",
      "Could frame thy fearful symmetry?"
    ];

    let currentMode = 'mixed';

    function createGlyphCard(tokenStr, isUpper, isChord, path) {
      const strokeColor = isUpper ? "#ffd700" : "#00f0ff";
      const cardClass = isUpper 
        ? "border-amber-500/50 bg-amber-950/20 gold-glow" 
        : "border-slate-800/80 bg-slate-950/70";
      const badgeClass = isUpper
        ? "text-amber-300 bg-amber-950/60 border border-amber-500/40"
        : "text-cyan-400 bg-cyan-950/60 border border-cyan-500/40";
      const svgClass = isUpper ? "glyph-svg-upper" : "glyph-svg-lower";
      const elevationText = isUpper ? "Z=25.0" : "Z=0.0";

      return `
        <div class="flex flex-col items-center p-2 rounded-lg rytt-card ${cardClass}">
          <svg viewBox="0 0 100 100" class="w-10 h-10 sm:w-12 sm:h-12 ${svgClass}">
            <path d="${path}" stroke="${strokeColor}" stroke-width="${isChord ? 4.5 : 4}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
          <div class="flex items-center gap-1 mt-1">
            <span class="text-[11px] font-mono font-bold ${isUpper ? 'text-amber-200' : 'text-cyan-300'}">${tokenStr}</span>
            <span class="text-[8px] font-mono px-1 py-0.2 rounded ${badgeClass}">${elevationText}</span>
          </div>
        </div>
      `;
    }

    function renderPoem() {
      const container = document.getElementById('poemContainer');
      container.innerHTML = '';

      originalPoem.forEach((rawLine, idx) => {
        let lineText = rawLine;
        if (currentMode === 'lower') lineText = rawLine.toLowerCase();
        if (currentMode === 'upper') lineText = rawLine.toUpperCase();

        const lineSection = document.createElement('section');
        lineSection.className = "p-5 rounded-2xl border border-slate-800 bg-slate-900/40 space-y-4";
        
        // Simple tokenization honoring punctuation
        const tokens = lineText.split(/(\s+|[,.;:!?])/);
        let wordsHTML = '<div class="flex flex-wrap items-center gap-x-4 gap-y-3">';

        tokens.forEach(tok => {
          if (!tok || tok.trim() === '') {
            wordsHTML += '<div class="w-2"></div>';
            return;
          }
          if (/^[,.;:!?]+$/.test(tok)) {
            wordsHTML += `<span class="text-slate-500 font-mono text-lg font-bold px-1">${tok}</span>`;
            return;
          }

          let wordGlyphs = '<div class="flex items-center gap-1.5 p-1.5 rounded-xl bg-slate-950/40 border border-slate-800/40">';
          let i = 0;
          while (i < tok.length) {
            // Check 4-gram chords first, then 3, then 2
            let matched = false;
            for (let cLen of [4, 3, 2]) {
              if (i + cLen <= tok.length) {
                const sub = tok.substring(i, i + cLen);
                const upperSub = sub.toUpperCase();
                if (RYTT_CHORDS[upperSub]) {
                  const isUpper = sub === sub.toUpperCase() && /[A-Z]/.test(sub);
                  wordGlyphs += createGlyphCard(sub, isUpper, true, RYTT_CHORDS[upperSub].path);
                  i += cLen;
                  matched = true;
                  break;
                }
              }
            }
            if (matched) continue;

            // Single character
            const ch = tok[i];
            const upperCh = ch.toUpperCase();
            if (RYTT_GENOME[upperCh]) {
              const isUpper = ch === ch.toUpperCase() && /[A-Z]/.test(ch);
              wordGlyphs += createGlyphCard(ch, isUpper, false, RYTT_GENOME[upperCh].path);
            } else {
              wordGlyphs += `<span class="text-slate-400 font-mono text-sm px-1">${ch}</span>`;
            }
            i += 1;
          }
          wordGlyphs += '</div>';
          wordsHTML += wordGlyphs;
        });

        wordsHTML += '</div>';

        lineSection.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-800/80 pb-2">
            <span class="font-serif-title text-sm sm:text-base text-amber-200 tracking-wider font-bold">Line ${idx + 1}: ${lineText}</span>
            <span class="text-xs font-mono text-cyan-400/80">Dual-Plane Lossless Verification Active</span>
          </div>
          ${wordsHTML}
        `;

        container.appendChild(lineSection);
      });
    }

    function setPoemCase(mode) {
      currentMode = mode;
      ['btnMixed', 'btnLower', 'btnUpper'].forEach(id => {
        const btn = document.getElementById(id);
        btn.className = "px-4 py-1.5 rounded-lg border border-slate-700 bg-slate-900/60 text-slate-400 font-mono text-xs font-bold hover:border-cyan-500/50 transition";
      });
      if (mode === 'mixed') document.getElementById('btnMixed').className = "px-4 py-1.5 rounded-lg border border-cyan-500 bg-cyan-500/20 text-cyan-300 font-mono text-xs font-bold transition";
      if (mode === 'lower') document.getElementById('btnLower').className = "px-4 py-1.5 rounded-lg border border-cyan-500 bg-cyan-500/20 text-cyan-300 font-mono text-xs font-bold transition";
      if (mode === 'upper') document.getElementById('btnUpper').className = "px-4 py-1.5 rounded-lg border border-amber-500 bg-amber-500/20 text-amber-300 font-mono text-xs font-bold transition";
      renderPoem();
    }

    renderPoem();
  </script>
</body>
</html>
