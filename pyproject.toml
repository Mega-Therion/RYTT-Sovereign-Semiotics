[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rytt-sovereign-semiotics"
version = "0.1.0"
description = "Formal, lossless, reversible grammar mapping language to radial glyph chords and dual-plane native tokens."
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "R.W. Yett", email = "R11110001Y@proton.me"}
]
keywords = ["semiotics", "glyph", "tokenization", "dual-plane", "lossless", "formal-methods"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.scripts]
rytt = "rytt._cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
rytt = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
addopts = "-v"
