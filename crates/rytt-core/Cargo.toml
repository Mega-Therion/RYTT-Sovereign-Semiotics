[package]
name = "rytt-core"
version = "0.1.0"
edition = "2021"
description = "JSON-first portable boundary for the RYTT sovereign semiotics grammar."
license = "MIT"
repository = "https://github.com/Mega-Therion/RYTT-Sovereign-Semiotics"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
wasm-bindgen = "0.2"

# Python bindings (enabled with `pyo3` feature for maturin builds)
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }

[dev-dependencies]
proptest = "1"

[features]
default = []
# Enable PyO3 Python extension module for maturin builds
python = ["dep:pyo3"]
# Enable C ABI (ffi module)
ffi = []

[lib]
name = "rytt_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]
