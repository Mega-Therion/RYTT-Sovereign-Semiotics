[package]
name = "rytt-core"
version = "0.1.0"
edition = "2021"
description = "JSON-first portable boundary for the RYTT sovereign semiotics grammar."
license = "MIT"
repository = "https://github.com/Mega-Therion/RYTT-Sovereign-Semiotics"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
wasm-bindgen = "0.2"

[lib]
name = "rytt_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]
