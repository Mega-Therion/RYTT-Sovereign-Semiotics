services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app:ro
    command: ["python", "-m", "http.server", "3000", "--bind", "0.0.0.0", "--directory", "/app"]
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:3000/', timeout=3); sys.exit(0 if b'RYTT' in r.read() else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
